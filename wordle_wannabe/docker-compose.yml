version: '3.9'
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wordle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wordle}
      POSTGRES_DB: ${POSTGRES_DB:-wordle_wannabe_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Mount initialization scripts (executed only on first run with empty data dir)
      - ./backend/sql:/docker-entrypoint-initdb.d:ro
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://wordle:wordle@postgres:5432/wordle_wannabe_db}
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    develop:
      watch:
        - action: sync
          path: ./backend/app
          target: /app/app
          ignore:
            - __pycache__/
        - action: rebuild
          path: ./backend/requirements.txt
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:4000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
volumes:
  pgdata:
